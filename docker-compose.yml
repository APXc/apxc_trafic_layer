services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      DB_URL: ${DB_URL}
      PYTHON_SIM_URL: ${PYTHON_SIM_URL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  python-sim:
    build:
      context: ./simulation-engine
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  worker:
    build:
      context: ./worker
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL}
      PYTHON_SIM_URL: ${PYTHON_SIM_URL}
    depends_on:
      redis:
        condition: service_healthy
      python-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"process.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - traffic-net

  postgres:
    image: postgis/postgis:16-3.4
    env_file:
      - .env
    environment:
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: traffic
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d traffic"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - traffic-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - traffic-net

networks:
  traffic-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
